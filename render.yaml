# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect repo → New Blueprint → select render.yaml, set OPENAI_API_KEY if needed.
services:
  - type: web
    name: job-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
