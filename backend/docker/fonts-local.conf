<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Word resumes commonly use Calibri; map to Carlito on Linux for LibreOffice PDF export. -->
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
</fontconfig>
